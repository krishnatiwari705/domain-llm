model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  max_new_tokens: 32
  device_map: auto
data:
  dataset: PolyAI/banking77
  train_split: train
  test_split: test
  output_dir: data/processed
training:
  output_dir: artifacts/lora
  epochs: 3
  learning_rate: 0.0002
  batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 512
  seed: 42
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
