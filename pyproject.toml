[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-llm"
version = "0.1.0"
description = "Fine-tune and serve Qwen2.5-1.5B-Instruct on Banking77"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["datasets>=2.19", "transformers>=4.44", "torch>=2.1", "peft>=0.12", "trl>=0.9", "accelerate>=0.33", "fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7", "PyYAML>=6.0", "scikit-learn>=1.5", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
domain-llm = "domain_llm.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["domain_llm"]

[tool.ruff.lint.isort]
known-first-party = ["domain_llm"]
known-third-party = ["typer"]
